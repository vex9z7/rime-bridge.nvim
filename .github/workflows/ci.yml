name: Linux integration tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Integration ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            nvim_arch: x86_64
            nvim_sha256: b2f91117be5b5ea39edd7297156dc2a4a8df4add6c95a90809a8df19e7ab6f52
          - arch: aarch64
            runner: ubuntu-22.04-arm
            nvim_arch: arm64
            nvim_sha256: ea4f9a31b11cc1477ff014aebb7b207684e7280f94ffa97abdab6cacd9b98519
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install system build and fixture dependencies
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          sudo apt-get update
          sudo apt-get install -y g++ cmake librime-dev librime-data rime-data-luna-pinyin python3
      - name: Install fixed Neovim for tests
        run: |
          curl --fail --location --retry 3 -o nvim.tar.gz https://github.com/neovim/neovim/releases/download/v0.11.5/nvim-linux-${{ matrix.nvim_arch }}.tar.gz
          echo '${{ matrix.nvim_sha256 }}  nvim.tar.gz' | sha256sum --check
          tar -xzf nvim.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-${{ matrix.nvim_arch }}/bin" >> "$GITHUB_PATH"
      - name: Fixed Blink dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Saghen/blink.cmp
          ref: 78336bc89ee5365633bcf754d93df01678b5c08f # v1.10.2
          path: build-deps/blink.cmp
          persist-credentials: false
      - name: Fixed Minuet dependency with late-result cancellation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: vex9z7/minuet-ai.nvim
          ref: c2740cd0aef0319c5720c9fd03cedcdff7faa2c1
          path: build-deps/minuet-ai.nvim
          persist-credentials: false
      - name: Configure, build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release             -DNVIM_EXECUTABLE="$(command -v nvim)"             -DRIME_BRIDGE_BLINK_DIR="$PWD/build-deps/blink.cmp"             -DRIME_BRIDGE_MINUET_DIR="$PWD/build-deps/minuet-ai.nvim"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix "$RUNNER_TEMP/rime-install"
          test -x "$RUNNER_TEMP/rime-install/bin/rime-bridge-worker"
          test -f "$RUNNER_TEMP/rime-install/share/licenses/rime-bridge/nlohmann-json-LICENSE.MIT"
          test ! -d "$RUNNER_TEMP/rime-install/include/nlohmann"
          nvim --version | head -1
          ldd --version | head -1
          dpkg-query -W librime1 librime-dev
      - name: Test Minuet cancellation dependency
        working-directory: build-deps/minuet-ai.nvim
        run: make test
      - name: Preserve fixed-fixture CTest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctest-linux-${{ matrix.arch }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
